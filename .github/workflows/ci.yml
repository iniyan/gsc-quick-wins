name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Skill frontmatter present
        run: |
          head -1 skills/gsc-quick-wins/SKILL.md | grep -q '^---$'
          grep -q '^name: gsc-quick-wins$' skills/gsc-quick-wins/SKILL.md
      - name: Manifests are valid JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Scorer runs on the sample export (md, csv, json)
        run: |
          S=skills/gsc-quick-wins/scripts/find_quick_wins.py
          python $S examples/sample-Queries.csv
          python $S examples/sample-Queries.csv --format csv > /dev/null
          python $S examples/sample-Queries.csv --format json | python -m json.tool > /dev/null
